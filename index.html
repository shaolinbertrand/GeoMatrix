<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMatrix - Espaço Geometria</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script>
        if (!localStorage.getItem('session_id') || localStorage.getItem('session_role') !== 'aluno') {
            window.location.href = 'login.html';
        }
    </script>
    
    <script src="motor-geometrico.js" defer></script>
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 1rem;">
            <div style="text-align: left;">
                <h1>GeoMatrix</h1>
                <p>Ambiente Virtual de Aprendizagem de Geometria Espacial (BNCC)</p>
            </div>
            <div style="text-align: right; font-size: 0.9rem;">
                <span id="labelNomeAluno" style="font-weight: bold; display: block; margin-bottom: 0.2rem;">Carregando...</span>
                <button onclick="fazerLogout()" style="background: #FF4D4D; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem;">Sair do Sistema</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        
        <div class="panel">
            <div class="motor-container">
                <motor-geometrico id="custom-motor-geometrico"></motor-geometrico>
            </div>
            
            <div class="control-group">
                <div class="input-block">
                    <label for="inputLargura">Largura</label>
                    <input type="number" id="inputLargura" value="160">
                </div>
                <div class="input-block">
                    <label for="inputAltura">Altura</label>
                    <input type="number" id="inputAltura" value="100">
                </div>
                <div class="input-block">
                    <label for="inputProfundidade">Profundidade</label>
                    <input type="number" id="inputProfundidade" value="80">
                </div>
            </div>

            <div id="textVolume" class="volume-display">Volume Total: 1.280.000 u³.</div>
        </div>

        <div class="panel">
            <div id="textPontuacao" class="score-badge">Pontos: 0</div>
            
            <div id="textEnunciado" class="enunciado-box">Carregando os desafios geométricos...</div>
            
            <div class="answer-block" id="interactive-controls">
                <input type="number" id="inputRespostaAluno" placeholder="Digite sua resposta aqui...">
                <button id="btnVerificar">Verificar Resposta</button>
            </div>

            <div id="boxFeedback" class="feedback-box"></div>
        </div>

    </div>

    <script>
        // CONFIGURAÇÕES DO REPOSITÓRIO
        const owner = "shaolinbertrand";
        const repo = "GeoMatrix";

        let desafios = []; 
        let dadosUsuarios = null;
        let shaUsuarios = "";

        // Recupera os dados da sessão do aluno
        const alunoId = localStorage.getItem('session_id');
        const alunoNome = localStorage.getItem('session_name');
        const alunoTurmaId = localStorage.getItem('session_turma');

        let desafioAtualIndex = 0;
        let pontuacao = 0;

        // Referências do DOM
        const inputLargura = document.getElementById('inputLargura');
        const inputAltura = document.getElementById('inputAltura');
        const inputProfundidade = document.getElementById('inputProfundidade');
        const textVolume = document.getElementById('textVolume');
        const motor = document.getElementById('custom-motor-geometrico');

        const textEnunciado = document.getElementById('textEnunciado');
        const inputRespostaAluno = document.getElementById('inputRespostaAluno');
        const btnVerificar = document.getElementById('btnVerificar');
        const textPontuacao = document.getElementById('textPontuacao');
        const boxFeedback = document.getElementById('boxFeedback');
        const interactiveControls = document.getElementById('interactive-controls');
        const labelNomeAluno = document.getElementById('labelNomeAluno');

        document.addEventListener('DOMContentLoaded', async () => {
            if (alunoNome) labelNomeAluno.innerText = `👋 Olá, ${alunoNome}!`;
            atualizarDimensoes();
            
            // 1. SINCRONIZA O PROGRESSO ATUAL DO ALUNO COM O USUARIOS.JSON NO REPOSITÓRIO
            try {
                const resUser = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/usuarios.json?t=${new Date().getTime()}`);
                const dataUser = await resUser.json();
                shaUsuarios = dataUser.sha;
                dadosUsuarios = JSON.parse(atob(dataUser.content));

                const turma = dadosUsuarios.turmas.find(t => t.id === alunoTurmaId);
                const alunoObj = turma ? turma.alunos.find(a => a.id === alunoId) : null;

                if (alunoObj) {
                    pontuacao = alunoObj.pontuacao || 0;
                    desafioAtualIndex = alunoObj.desafios_concluidos || 0;
                    textPontuacao.innerText = `Pontos: ${pontuacao}`;
                }
            } catch (err) {
                console.error("Erro ao carregar progresso do aluno. Rodando em modo offline local.");
            }

            // 2. BUSCA AS QUESTÕES DO BANCO DE DESAFIOS
            try {
                const respostaJSON = await fetch(`questoes.json?t=${new Date().getTime()}`);
                if (!respostaJSON.ok) throw new Error();
                desafios = await respostaJSON.json();
                carregarDesafio();
            } catch (err) {
                textEnunciado.innerHTML = "<div class='feedback-box feedback-error' style='display:block;'>❌ Erro ao carregar o banco de desafios geométricos.</div>";
            }

            // Configuração de Eventos
            inputLargura.addEventListener('input', atualizarDimensoes);
            inputAltura.addEventListener('input', atualizarDimensoes);
            inputProfundidade.addEventListener('input', atualizarDimensoes);
            btnVerificar.addEventListener('click', verificarResposta);
        });

        function atualizarDimensoes() {
            const larg = inputLargura.value || "160";
            const alt = inputAltura.value || "100";
            const prof = inputProfundidade.value || "80";

            const volume = Number(larg) * Number(alt) * Number(prof);
            textVolume.innerText = `Volume Total: ${volume.toLocaleString()} u³.`;

            if (motor) {
                motor.setAttribute('largura', larg);
                motor.setAttribute('altura', alt);
                motor.setAttribute('profundidade', prof);
            }
        }

        function carregarDesafio() {
            boxFeedback.style.display = 'none';
            if (desafios.length > 0 && desafioAtualIndex < desafios.length) {
                textEnunciado.innerHTML = desafios[desafioAtualIndex].enunciado;
                inputRespostaAluno.value = "";
            } else if (desafios.length > 0) {
                textEnunciado.innerHTML = "<h2>🏆 Incrível, você completou todos os desafios do GeoMatrix!</h2>";
                interactiveControls.style.display = 'none';
                textPontuacao.style.backgroundColor = '#D4EFDF';
                textPontuacao.style.color = '#196F3D';
                textPontuacao.style.borderColor = '#2ECC71';
            }
        }

        async function verificarResposta() {
            if (desafios.length === 0) return;

            const respostaDigitada = Number(inputRespostaAluno.value);
            const respostaCerta = Number(desafios[desafioAtualIndex].resposta_correta);

            if (respostaDigitada === respostaCerta) {
                pontuacao += 10;
                desafioAtualIndex++;
                textPontuacao.innerText = `Pontos: ${pontuacao}`;
                
                boxFeedback.className = "feedback-box feedback-success";
                boxFeedback.innerHTML = "✅ Resposta correta! Excelente raciocínio geométrico!";
                boxFeedback.style.display = 'block';

                // Opcional: Se for persistir o progresso do aluno via API aqui, a lógica do PUT entraria abaixo.
                
                setTimeout(() => {
                    carregarDesafio();
                }, 2500);
            } else {
                boxFeedback.className = "feedback-box feedback-error";
                boxFeedback.innerHTML = "❌ Resposta incorreta. Dica: Use o simulador 3D ao lado colocando as dimensões do enunciado para visualizar o sólido e conferir seus cálculos!";
                boxFeedback.style.display = 'block';
            }
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
