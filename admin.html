<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMatrix - Painel do Professor</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .admin-container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .nav-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid #E2E8F0; padding-bottom: 0.5rem; }
        .nav-btn { padding: 0.6rem 1.2rem; border: none; background: #E2E8F0; font-weight: bold; cursor: pointer; border-radius: 6px; color: #4A5568; transition: all 0.2s; }
        .nav-btn.active { background: #1A2B4C; color: white; }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
        textarea { width: 100%; height: 80px; padding: 0.7rem; border: 2px solid #CBD5E0; border-radius: 6px; font-size: 1rem; resize: vertical; }
        .btn-success { background-color: #2ECC71 !important; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; height: 42px; }
        .btn-danger { background-color: #E74C3C !important; padding: 0.4rem 0.8rem !important; font-size: 0.85rem !important; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background-color: #1A2B4C; color: white; }
        .token-box { background-color: #FFF5F5; border: 1px solid #FEB2B2; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .grid-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        @media (max-width: 768px) { .grid-forms { grid-template-columns: 1fr; } }
        .section-view { display: none; }
        .section-view.active { display: block; }
        .turma-card { background: #F7FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <header>
        <h1>GeoMatrix - Painel do Professor</h1>
        <p>Gerenciamento do AVA (Questões, Turmas e Relatórios de Desempenho)</p>
    </header>

    <div class="admin-container">
        <div class="token-box">
            <label style="font-weight: bold; color: #9B2C2C;">Chave de Acesso GitHub (PAT):</label>
            <input type="password" id="inputToken" placeholder="Cole seu ghp_token aqui para poder aplicar qualquer alteração...">
        </div>

        <div class="nav-tabs">
            <button id="btnTabQuestoes" class="nav-btn active" onclick="alternarAba('questoes')">Gerenciar Questões</button>
            <button id="btnTabTurmas" class="nav-btn" onclick="alternarAba('turmas')">Turmas & Relatórios</button>
        </div>

        <div id="statusMsg" class="feedback-box" style="margin-bottom: 1.5rem;"></div>

        <div id="viewQuestoes" class="section-view active">
            <div class="panel">
                <h2>Cadastrar Nova Questão</h2>
                <div class="form-row">
                    <div class="input-block">
                        <label>Enunciado da Questão (HTML permitido):</label>
                        <textarea id="formEnunciado" placeholder="Ex: <p><strong>Desafio:</strong> Calcule o volume...</p>"></textarea>
                    </div>
                </div>
                <div class="control-group" style="grid-template-columns: 1fr 1fr; margin-top:1rem;">
                    <div class="input-block">
                        <label>Resposta Correta (Número Inteiro):</label>
                        <input type="number" id="formResposta" placeholder="Ex: 120">
                    </div>
                    <div class="input-block" style="justify-content: flex-end;">
                        <button onclick="adicionarQuestao()" class="btn-success" style="width:100%;">Salvar Questão</button>
                    </div>
                </div>
            </div>

            <div class="panel" style="margin-top: 2rem;">
                <h2>Questões Atuais no Banco</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Enunciado</th>
                                <th style="width: 120px;">Gabarito</th>
                                <th style="width: 100px;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaQuestoesCorpo"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="viewTurmas" class="section-view">
            <div class="grid-forms">
                <div class="panel">
                    <h2>Nova Turma</h2>
                    <div class="form-row">
                        <div class="input-block">
                            <label>Nome da Turma:</label>
                            <input type="text" id="formNomeTurma" placeholder="Ex: 8º Ano C - Tarde">
                        </div>
                    </div>
                    <button onclick="criarTurma()" class="btn-success" style="width:100%; margin-top:1.5rem;">Criar Turma</button>
                </div>

                <div class="panel">
                    <h2>Vincular Aluno à Turma</h2>
                    <div class="form-row">
                        <div class="input-block">
                            <label>Selecione a Turma:</label>
                            <select id="selectTurmaAluno" style="padding: 0.6rem; border:2px solid #CBD5E0; border-radius:6px;"></select>
                        </div>
                    </div>
                    <div class="control-group" style="grid-template-columns: 1fr 1fr; margin-top:0.5rem;">
                        <div class="input-block">
                            <label>Nome Completo:</label>
                            <input type="text" id="formNomeAluno" placeholder="Ex: Jean Bertrand">
                        </div>
                        <div class="input-block">
                            <label>Login de Usuário:</label>
                            <input type="text" id="formUserAluno" placeholder="Ex: jean.bertrand">
                        </div>
                    </div>
                    <button onclick="vincularAluno()" class="btn-success" style="width:100%; margin-top:1.2rem;">Matricular Aluno</button>
                </div>
            </div>

            <div class="panel" style="margin-top: 2rem;">
                <h2>Relatório de Desempenho por Turma</h2>
                <div id="containerRelatorios" style="margin-top:1.5rem;"></div>
            </div>
        </div>

    </div>

    <script>
        const owner = "shaolinbertrand";
        const repo = "GeoMatrix";
        
        let listaQuestoes = [];
        let dadosUsuarios = null;
        let shaQuestoes = "";
        let shaUsuarios = "";

        document.addEventListener('DOMContentLoaded', () => {
            buscarQuestoes();
            buscarUsuarios();
        });

        function alternarAba(aba) {
            document.getElementById('viewQuestoes').classList.toggle('active', aba === 'questoes');
            document.getElementById('viewTurmas').classList.toggle('active', aba === 'turmas');
            document.getElementById('btnTabQuestoes').classList.toggle('active', aba === 'questoes');
            document.getElementById('btnTabTurmas').classList.toggle('active', aba === 'turmas');
        }

        // ================= OPERAÇÕES DE QUESTÕES =================
        async function buscarQuestoes() {
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/questoes.json?t=${new Date().getTime()}`);
                const data = await res.json();
                shaQuestoes = data.sha;
                listaQuestoes = JSON.parse(atob(data.content));
                renderizarQuestoes();
            } catch (err) { console.error("Erro ao ler questões."); }
        }

        function renderizarQuestoes() {
            const tbody = document.getElementById('tabelaQuestoesCorpo');
            tbody.innerHTML = listaQuestoes.length === 0 ? "<tr><td colspan='3'>Nenhuma questão.</td></tr>" : "";
            listaQuestoes.forEach((q, idx) => {
                tbody.innerHTML += `<tr><td>${q.enunciado}</td><td><strong>${q.resposta_correta}</strong></td><td><button class="btn-danger" onclick="deletarQuestao(${idx})">Excluir</button></td></tr>`;
            });
        }

        async function adicionarQuestao() {
            const tok = document.getElementById('inputToken').value;
            const enu = document.getElementById('formEnunciado').value;
            const res = document.getElementById('formResposta').value;
            if(!tok || !enu || !res) return mostrarMsg("Preencha o Token, Enunciado e Gabarito.", "error");

            listaQuestoes.push({ enunciado: enu, resposta_correta: Number(res) });
            await enviarProGitHub('questoes.json', listaQuestoes, shaQuestoes, tok, "Adicionada nova questão", () => {
                document.getElementById('formEnunciado').value = "";
                document.getElementById('formResposta').value = "";
                buscarQuestoes();
            });
        }

        async function deletarQuestao(idx) {
            const tok = document.getElementById('inputToken').value;
            if(!tok) return mostrarMsg("Insira o seu Token para poder excluir.", "error");
            if(confirm("Deseja apagar esta questão?")) {
                listaQuestoes.splice(idx, 1);
                await enviarProGitHub('questoes.json', listaQuestoes, shaQuestoes, tok, "Removida uma questão", buscarQuestoes);
            }
        }

        // ================= OPERAÇÕES DE TURMAS E ALUNOS =================
        async function buscarUsuarios() {
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/usuarios.json?t=${new Date().getTime()}`);
                const data = await res.json();
                shaUsuarios = data.sha;
                dadosUsuarios = JSON.parse(atob(data.content));
                renderizarPainelTurmas();
            } catch (err) { console.error("Erro ao ler usuários."); }
        }

        function renderizarPainelTurmas() {
            if(!dadosUsuarios) return;
            const select = document.getElementById('selectTurmaAluno');
            const container = document.getElementById('containerRelatorios');
            
            select.innerHTML = "";
            container.innerHTML = dadosUsuarios.turmas.length === 0 ? "<p>Nenhuma turma criada até o momento.</p>" : "";

            dadosUsuarios.turmas.forEach(t => {
                // Preenche o Select
                select.innerHTML += `<option value="${t.id}">${t.nome_turma}</option>`;
                
                // Constrói as tabelas de relatórios visuais
                let linhasAlunos = t.alunos.length === 0 ? "<tr><td colspan='3'>Nenhum aluno matriculado nesta turma.</td></tr>" : "";
                t.alunos.forEach(a => {
                    linhasAlunos += `<tr><td>${a.nome} (<em>@${a.usuario}</em>)</td><td><strong>${a.desafios_concluidos}</strong></td><td><span style="color:#B7791F; font-weight:bold;">${a.pontuacao} pts</span></td></tr>`;
                });

                container.innerHTML += `
                    <div class="turma-card">
                        <h3>🏫 ${t.nome_turma} <span style="font-size:0.85rem; color:#718096;">(ID: ${t.id})</span></h3>
                        <table>
                            <thead>
                                <tr><th>Nome do Aluno</th><th>Desafios Feitos</th><th>Pontuação Total</th></tr>
                            </thead>
                            <tbody>${linhasAlunos}</tbody>
                        </table>
                    </div>
                `;
            });
        }

        async function criarTurma() {
            const tok = document.getElementById('inputToken').value;
            const nome = document.getElementById('formNomeTurma').value.trim();
            if(!tok || !nome) return mostrarMsg("Preencha o Token e o Nome da Turma.", "error");

            const idTurma = "turma_" + Math.random().toString(3
