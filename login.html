<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMatrix - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container { max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
        .tab-group { display: flex; margin-bottom: 1.5rem; background: #E2E8F0; border-radius: 6px; padding: 0.3rem; }
        .tab-btn { flex: 1; padding: 0.6rem; border: none; background: transparent; font-weight: bold; cursor: pointer; border-radius: 4px; color: #4A5568; transition: all 0.2s; }
        .tab-btn.active { background: #1A2B4C; color: white; }
        .form-row { margin-bottom: 1.2rem; display: flex; flex-direction: column; }
        .form-row label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #4A5568; }
        .form-row input { padding: 0.7rem; border: 2px solid #CBD5E0; border-radius: 6px; font-size: 1rem; outline: none; }
        .form-row input:focus { border-color: #1A2B4C; }
        .btn-login { background-color: #1A2B4C; color: white; border: none; padding: 0.8rem; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-login:hover { background-color: #2C3E50; }
    </style>
</head>
<body>

    <header>
        <h1>GeoMatrix</h1>
        <p>Acesse o Ambiente Virtual de Aprendizagem</p>
    </header>

    <div class="login-container">
        <div class="panel">
            <div class="tab-group">
                <button id="tabAluno" class="tab-btn active" onclick="mudarTipo('aluno')">Aluno</button>
                <button id="tabProf" class="tab-btn" onclick="mudarTipo('professor')">Professor</button>
            </div>

            <h2 id="loginTitle" style="margin-bottom: 1.5rem; font-size: 1.3rem;">Área do Aluno</h2>

            <div class="form-row">
                <label for="inputUser">Usuário:</label>
                <input type="text" id="inputUser" placeholder="Digite seu usuário...">
            </div>

            <div class="form-row">
                <label for="inputSenha">Senha:</label>
                <input type="password" id="inputSenha" placeholder="Digite sua senha...">
            </div>

            <button class="btn-login" onclick="executarLogin()">Entrar no Sistema</button>
            
            <div id="loginFeedback" class="feedback-box" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script>
        let tipoUsuario = 'aluno'; // Estado inicial
        let dadosUsuarios = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Limpa qualquer sessão anterior ao entrar na tela de login
            localStorage.clear();
            
            try {
                const res = await fetch(`usuarios.json?t=${new Date().getTime()}`);
                dadosUsuarios = await res.json();
            } catch (err) {
                mostrarErro("Erro ao carregar banco de autenticação.");
            }
        });

        function mudarTipo(tipo) {
            tipoUsuario = tipo;
            document.getElementById('tabAluno').classList.toggle('active', tipo === 'aluno');
            document.getElementById('tabProf').classList.toggle('active', tipo === 'professor');
            document.getElementById('loginTitle').innerText = tipo === 'aluno' ? 'Área do Aluno' : 'Painel do Professor';
            document.getElementById('loginFeedback').style.display = 'none';
        }

        function executarLogin() {
            const user = document.getElementById('inputUser').value.trim();
            const senha = document.getElementById('inputSenha').value.trim();
            const feedback = document.getElementById('loginFeedback');

            if (!user || !senha) {
                return mostrarErro("Por favor, preencha todos os campos.");
            }

            if (!dadosUsuarios) {
                return mostrarErro("Sistema indisponível momentaneamente.");
            }

            if (tipoUsuario === 'professor') {
                // Validação do Professor
                const prof = dadosUsuarios.professores.find(p => p.usuario === user && p.senha === senha);
                if (prof) {
                    localStorage.setItem('session_role', 'professor');
                    localStorage.setItem('session_name', prof.nome);
                    window.location.href = 'admin.html';
                } else {
                    mostrarErro("Usuário ou senha de professor incorretos.");
                }
            } else {
                // Validação do Aluno vasculhando as turmas
                let alunoEncontrado = null;
                let turmaId = null;

                for (const turma of dadosUsuarios.turmas) {
                    const aluno = turma.alunos.find(a => a.usuario === user && a.senha === senha);
                    if (aluno) {
                        alunoEncontrado = aluno;
                        turmaId = turma.id;
                        break;
                    }
                }

                if (alunoEncontrado) {
                    localStorage.setItem('session_role', 'aluno');
                    localStorage.setItem('session_id', alunoEncontrado.id);
                    localStorage.setItem('session_name', alunoEncontrado.name || alunoEncontrado.nome);
                    localStorage.setItem('session_turma', turmaId);
                    window.location.href = 'index.html';
                } else {
                    mostrarErro("Usuário ou senha de aluno incorretos.");
                }
            }
        }

        function mostrarErro(msg) {
            const feedback = document.getElementById('loginFeedback');
            feedback.innerText = "❌ " + msg;
            feedback.className = "feedback-box feedback-error";
            feedback.style.display = 'block';
        }
    </script>
</body>
</html>
